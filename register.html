{% extends "base.html" %}

{% block title %}Register - Library Management System{% endblock %}

{% block content %}
<div class="auth-container fade-in">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary-color);">Create Account</h2>
        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 1rem; color: var(--text-muted);"></i>
                    <input type="text" name="name" id="name" class="form-control" style="padding-left: 2.5rem;" required placeholder="John Doe">
                </div>
            </div>

            <div class="form-group">
                <label for="email">College Email Address</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 1rem; color: var(--text-muted);"></i>
                    <input type="email" name="email" id="email" class="form-control" style="padding-left: 2.5rem;" required placeholder="student@college.edu">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 1rem; color: var(--text-muted);"></i>
                    <input type="password" name="password" id="password" class="form-control" style="padding-left: 2.5rem;" required placeholder="••••••••">
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-check-double" style="position: absolute; left: 1rem; top: 1rem; color: var(--text-muted);"></i>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" style="padding-left: 2.5rem;" required placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary-color); font-weight: 600;">Log in here</a>
        </p>
    </div>
</div>
{% endblock %}
